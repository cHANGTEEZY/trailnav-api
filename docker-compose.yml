services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: trailnav-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trailnav
    ports:
      - "5432:5432"
    volumes:
      - trailnav_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trailnav"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trailnav_pgdata:
